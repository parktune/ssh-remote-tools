[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-remote-tools"
version = "0.2.0"
description = "Private Tailscale peer discovery, pairing, messaging and OpenSSH for Windows and Ubuntu"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
srt = "ssh_remote_tools.__main__:main"

[tool.setuptools.packages.find]
include = ["ssh_remote_tools*"]
